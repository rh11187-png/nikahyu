<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Digital - Viding Edition</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           GLOBAL VARIABLES & THEMES (VIDING STYLE)
           ========================================= */
        :root {
            --primary: #c5a059; 
            --primary-dark: #9e7a32;
            --bg-color: #faf8f5; 
            --text-dark: #2b2b2b;
            --text-light: #666666; 
            --white: #ffffff;
            --border-color: #e2d8c3; 
            --card-bg: rgba(255, 255, 255, 0.9);
            --font-serif: 'Playfair Display', serif;
            --font-cursive: 'Great Vibes', cursive;
            --font-heading: 'Cinzel', serif;
            --font-sans: 'Lato', sans-serif;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --radius: 16px;
        }

        /* 10 THEME CLASSES INSPIRED BY VIDING.CO */
        .theme-envelope-velvet { --primary: #c5a059; --primary-dark: #9b7936; --bg-color: #3b0914; --text-dark: #f8f1e5; --text-light: #d4c3b3; --white: #27040c; --border-color: #5c1422; --card-bg: rgba(39, 4, 12, 0.85); }
        .theme-palembang { --primary: #d4af37; --primary-dark: #aa8513; --bg-color: #2a080c; --text-dark: #fcf6e8; --text-light: #e0d0b0; --white: #1f0407; --border-color: #4a0f16; --card-bg: rgba(31, 4, 7, 0.9); }
        .theme-jawa-royal { --primary: #b8860b; --primary-dark: #8b6508; --bg-color: #1a1612; --text-dark: #f5eedc; --text-light: #c5b8a0; --white: #28221c; --border-color: #3d342a; --card-bg: rgba(40, 34, 28, 0.9); }
        .theme-minang { --primary: #e6b800; --primary-dark: #b38f00; --bg-color: #4a0000; --text-dark: #fff5e6; --text-light: #eccd99; --white: #330000; --border-color: #660000; --card-bg: rgba(51, 0, 0, 0.9); }
        .theme-chinese-radiance { --primary: #ffd700; --primary-dark: #ccac00; --bg-color: #7a0010; --text-dark: #fff0f5; --text-light: #f5b0bb; --white: #52000b; --border-color: #a30016; --card-bg: rgba(82, 0, 11, 0.9); }
        .theme-floral { --primary: #556b2f; --primary-dark: #3b4b20; --bg-color: #f4f6f0; --text-dark: #2d381c; --text-light: #5d6d48; --white: #ffffff; --border-color: #d1dbc2; --card-bg: rgba(255, 255, 255, 0.95); }
        .theme-boho { --primary: #c86d51; --primary-dark: #a14e35; --bg-color: #fbf5f1; --text-dark: #4a2c22; --text-light: #835c50; --white: #ffffff; --border-color: #ebd3c8; --card-bg: rgba(255, 255, 255, 0.95); }
        .theme-midnight { --primary: #e0a96d; --primary-dark: #bc8041; --bg-color: #0c1017; --text-dark: #f0f4f8; --text-light: #94a3b8; --white: #161f2e; --border-color: #233148; --card-bg: rgba(22, 31, 46, 0.85); }
        .theme-minimalist { --primary: #111111; --primary-dark: #333333; --bg-color: #ffffff; --text-dark: #111111; --text-light: #666666; --white: #f8f8f8; --border-color: #e5e5e5; --card-bg: #ffffff; }
        .theme-emerald { --primary: #127a53; --primary-dark: #0a4f35; --bg-color: #f2f9f5; --text-dark: #073021; --text-light: #3d6e5a; --white: #ffffff; --border-color: #c1e5d5; --card-bg: rgba(255, 255, 255, 0.95); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); overflow-x: hidden; background: #f8fafc; color: var(--text-dark); }
        h1, h2, h3 { font-family: var(--font-serif); }
        .cursive { font-family: var(--font-cursive); color: var(--primary); }
        .cinzel { font-family: var(--font-heading); letter-spacing: 2px; }

        /* OVERLAY & TOASTS */
        .modal-overlay { z-index: 1000; }
        #toast-container { z-index: 3000; position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: #ffffff; color: #333; padding: 14px 22px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-left: 5px solid var(--primary); font-weight: 600; font-size: 0.95rem; }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: #10b981; } .toast.success i { color: #10b981; }
        .toast.error { border-left-color: #ef4444; } .toast.error i { color: #ef4444; }
        .toast.info { border-left-color: #3b82f6; } .toast.info i { color: #3b82f6; }

        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: all 0.3s; z-index: 9999; color: #fff; }
        #loading-overlay.active { visibility: visible; opacity: 1; }
        .spinner { width: 55px; height: 55px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 1.2rem; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* BUTTONS & FORMS */
        .btn { padding: 12px 24px; border-radius: 30px; border: none; cursor: pointer; font-weight: 600; transition: all 0.3s ease; font-family: var(--font-sans); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.25); filter: brightness(1.1); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #fff; }

        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 700; font-size: 0.9rem; color: var(--text-dark); }
        .form-control { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-color); border-radius: 12px; font-family: var(--font-sans); background: var(--white); color: var(--text-dark); transition: 0.3s; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.2); }

        /* PORTAL & PUBLIC LINK SHARE PAGE */
        .portal-bg { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80') center/cover fixed; padding: 20px; }
        .portal-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); padding: 3.5rem 2.5rem; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); text-align: center; max-width: 520px; width: 100%; border: 1px solid rgba(255,255,255,0.6); }
        .portal-title { font-family: var(--font-cursive); font-size: 4.5rem; color: #c5a059; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }

        /* MODERN ADMIN PANEL */
        .admin-layout { display: flex; height: 100vh; background: #f1f5f9; overflow: hidden; }
        .admin-sidebar { width: 280px; background: #0f172a; color: #94a3b8; display: flex; flex-direction: column; border-right: 1px solid #1e293b; z-index: 10; }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid #1e293b; }
        .sidebar-menu { list-style: none; padding: 20px 12px; flex: 1; overflow-y: auto; }
        .sidebar-menu li { padding: 14px 18px; cursor: pointer; margin-bottom: 6px; border-radius: 12px; transition: 0.3s; display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 0.95rem; }
        .sidebar-menu li:hover { background: rgba(255,255,255,0.06); color: #f8fafc; }
        .sidebar-menu li.active { background: #6366f1; color: #ffffff; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35); }
        .admin-content { flex: 1; overflow-y: auto; padding: 35px; background: #f8fafc; }
        
        .admin-card { background: #ffffff; border-radius: 20px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .admin-card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; color: #0f172a; display: flex; align-items: center; gap: 10px; }
        .admin-card-title i { color: #6366f1; background: #eef2ff; padding: 10px; border-radius: 10px; font-size: 1rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* THEME SELECTION CARDS ALA VIDING */
        .viding-theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
        .viding-theme-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.3s; position: relative; }
        .viding-theme-card:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); border-color: #6366f1; }
        .viding-theme-card.active { border-color: #6366f1; ring: 3px rgba(99, 102, 241, 0.3); }
        .viding-theme-card.active::before { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; top: 10px; right: 10px; background: #6366f1; color: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; z-index: 2; }
        .viding-theme-preview { height: 110px; display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-cursive); font-size: 2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }

        /* INVITATION WRAPPER & ANIMATED ENVELOPE (VIDING STYLE) */
        .invitation-wrapper { background-color: var(--bg-color); color: var(--text-dark); min-height: 100vh; position: relative; transition: all 0.5s ease; }
        .cover-envelope { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease; }
        .cover-envelope.open { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        .wax-seal { width: 90px; height: 90px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 2.2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.25); margin: 2rem auto; border: 3px solid rgba(255,255,255,0.4); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* FLOATING MENU BAR (BOTTOM) */
        .floating-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(15px); padding: 8px 18px; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); display: flex; gap: 18px; z-index: 90; border: 1px solid rgba(255,255,255,0.5); opacity: 0; pointer-events: none; transition: 0.5s; }
        .floating-nav.active { opacity: 1; pointer-events: auto; }
        .floating-nav a { color: var(--text-light); text-decoration: none; font-size: 1.2rem; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .floating-nav a:hover, .floating-nav a.active { background: var(--primary); color: #ffffff; }

        /* COUNTDOWN TIMER */
        .countdown-grid { display: flex; justify-content: center; gap: 15px; margin: 2rem 0; flex-wrap: wrap; }
        .countdown-box { background: var(--white); padding: 15px 20px; border-radius: 14px; min-width: 80px; box-shadow: var(--shadow); border: 1px solid var(--border-color); text-align: center; }
        .countdown-num { font-size: 1.8rem; font-weight: 700; color: var(--primary); font-family: var(--font-heading); }
        .countdown-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-light); margin-top: 4px; }

        /* SECTIONS */
        .inv-section { padding: 5rem 1.5rem; text-align: center; max-width: 1000px; margin: 0 auto; }
        .couple-container { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 3rem; margin-top: 3rem; }
        .couple-card { flex: 1; min-width: 260px; background: var(--card-bg); padding: 2.5rem 1.5rem; border-radius: var(--radius); border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .couple-avatar { width: 170px; height: 170px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); margin: 0 auto 1.5rem; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 2rem; }
        .gallery-grid img { width: 100%; height: 260px; object-fit: cover; border-radius: 12px; cursor: pointer; transition: 0.4s; border: 1px solid var(--border-color); }
        .gallery-grid img:hover { transform: scale(1.03); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

        /* LIGHTBOX MODAL */
        #lightbox-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 4000; display: none; align-items: center; justify-content: center; padding: 20px; }
        #lightbox-img { max-width: 90%; max-height: 85vh; border-radius: 12px; }

        .audio-btn { position: fixed; bottom: 25px; right: 25px; width: 52px; height: 52px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 95; opacity: 0; pointer-events: none; transition: 0.4s; font-size: 1.2rem; }
        .audio-btn.visible { opacity: 1; pointer-events: auto; }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .admin-layout { flex-direction: column; }
            .admin-sidebar { width: 100%; height:auto; }
            .sidebar-header { display: none; }
            .sidebar-menu { display: flex; overflow-x: auto; padding: 10px; }
            .sidebar-menu li { white-space: nowrap; margin-bottom:0; }
        }
    </style>
</head>
<body>

    <div id="app-root"></div>
    <div id="toast-container"></div>
    
    <!-- LIGHTBOX MODAL -->
    <div id="lightbox-modal" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Full View">
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <h3 class="cinzel" style="font-size: 1.2rem; letter-spacing: 3px;" id="load-msg">MEMPROSES...</h3>
    </div>

    <!-- TEMPLATE: PORTAL UTAMA -->
    <template id="tpl-portal">
        <div class="portal-bg">
            <div class="portal-card">
                <h1 class="portal-title">The Wedding</h1>
                <p style="color: #64748b; font-size: 1rem; margin-bottom: 2rem;">Sistem Undangan Digital Viding Edition</p>
                <div style="display: flex; flex-direction: column; gap: 14px;">
                    <button class="btn btn-primary" onclick="loadGuestView()"><i class="fas fa-envelope-open-text"></i> Lihat Undangan (Sebagai Tamu)</button>
                    <button class="btn btn-outline" style="border-color: #0f172a; color: #0f172a;" onclick="loadLoginView()"><i class="fas fa-user-shield"></i> Masuk Panel Admin</button>
                    <button class="btn" style="background: #f1f5f9; color: #475569;" onclick="loadPublicShareView()"><i class="fas fa-share-alt"></i> Generator Link Tamu (Publik)</button>
                </div>
            </div>
        </div>
    </template>

    <!-- TEMPLATE: PUBLIC SHARE PAGE (Bisa diakses tanpa login admin) -->
    <template id="tpl-public-share">
        <div class="portal-bg">
            <div class="portal-card" style="max-width: 600px; text-align: left;">
                <button class="btn" style="background: #f1f5f9; color: #333; margin-bottom: 1.5rem;" onclick="initApp()"><i class="fas fa-arrow-left"></i> Kembali</button>
                <h2 class="serif" style="color: #0f172a; margin-bottom: 0.5rem;">Sebar Undangan Pernikahan</h2>
                <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">Ketik nama tamu di bawah ini untuk membuat link undangan khusus.</p>
                <div class="form-group">
                    <label>Nama Tamu Undangan</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="pub-guest-name" class="form-control" placeholder="Contoh: Keluarga Bpk. Ahmad">
                        <button class="btn btn-primary" onclick="generatePublicLink()"><i class="fas fa-magic"></i> Buat</button>
                    </div>
                </div>
                <div id="pub-result-box" style="display: none; margin-top: 1.5rem; background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1;">
                    <p style="font-size: 0.85rem; color: #475569; font-weight: 700; margin-bottom: 6px;">LINK UNDANGAN TAMU:</p>
                    <code id="pub-link-url" style="display: block; word-break: break-all; background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.9rem; color: #2563eb;"></code>
                    <div style="display: flex; gap: 10px; margin-top: 12px;">
                        <button class="btn btn-primary" style="flex: 1;" onclick="copyPublicLink()"><i class="fas fa-copy"></i> Salin Link</button>
                        <button class="btn btn-outline" style="flex: 1;" onclick="previewPublicLink()"><i class="fas fa-eye"></i> Buka Undangan</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- TEMPLATE: LOGIN ADMIN -->
    <template id="tpl-login">
        <div class="portal-bg">
            <div class="portal-card" style="max-width: 420px;">
                <button class="btn" style="background: #f1f5f9; color: #333; margin-bottom: 1.5rem; float: left;" onclick="initApp()"><i class="fas fa-arrow-left"></i></button>
                <div style="clear: both; margin-bottom: 1.5rem;">
                    <i class="fas fa-lock" style="font-size: 3rem; color: #c5a059; margin-bottom: 0.5rem;"></i>
                    <h2 class="serif">Admin Panel</h2>
                </div>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group"><label>Username</label><input type="text" id="login-user" class="form-control" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="login-pass" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Masuk Dashboard</button>
                </form>
            </div>
        </div>
    </template>

    <!-- TEMPLATE: ADMIN DASHBOARD -->
    <template id="tpl-admin-dashboard">
        <div class="admin-layout">
            <div class="admin-sidebar">
                <div class="sidebar-header"><h2 class="cursive" style="color:#c5a059; font-size: 2.2rem;">Panel Admin</h2></div>
                <ul class="sidebar-menu">
                    <li class="active" onclick="switchTab('tab-tema', this)"><i class="fas fa-palette"></i> Pilih Tema Viding</li>
                    <li onclick="switchTab('tab-mempelai', this)"><i class="fas fa-heart"></i> Data Mempelai</li>
                    <li onclick="switchTab('tab-acara', this)"><i class="fas fa-calendar-alt"></i> Data Acara</li>
                    <li onclick="switchTab('tab-media', this)"><i class="fas fa-photo-video"></i> Media & Playlist</li>
                    <li onclick="switchTab('tab-keuangan', this)"><i class="fas fa-qrcode"></i> QRIS & Rekening</li>
                    <li onclick="switchTab('tab-sebar', this)"><i class="fas fa-share-alt"></i> Sebar Undangan</li>
                    <li onclick="initApp()" style="margin-top: auto; color: #ef4444;"><i class="fas fa-sign-out-alt"></i> Keluar</li>
                </ul>
            </div>
            <div class="admin-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h2 class="serif" style="color: #0f172a;">Pengaturan Undangan</h2>
                    <button class="btn btn-primary" onclick="saveAllSettings()"><i class="fas fa-save"></i> Simpan ke Database</button>
                </div>

                <!-- TAB TEMA -->
                <div id="tab-tema" class="admin-tab">
                    <div class="admin-card">
                        <h3 class="admin-card-title"><i class="fas fa-magic"></i> 10 Tema Viding Style</h3>
                        <div class="viding-theme-grid" id="viding-theme-container"></div>
                    </div>
                </div>

                <!-- TAB MEMPELAI -->
                <div id="tab-mempelai" class="admin-tab" style="display: none;">
                    <div class="admin-card"><h3 class="admin-card-title"><i class="fas fa-male"></i> Mempelai Pria</h3><div class="grid-2"><div class="form-group"><label>Nama Lengkap</label><input type="text" id="in-groom-name" class="form-control"></div><div class="form-group"><label>Nama Panggilan</label><input type="text" id="in-groom-nickname" class="form-control"></div><div class="form-group" style="grid-column: span 2;"><label>Nama Orang Tua</label><input type="text" id="in-groom-parents" class="form-control"></div></div></div>
                    <div class="admin-card"><h3 class="admin-card-title"><i class="fas fa-female"></i> Mempelai Wanita</h3><div class="grid-2"><div class="form-group"><label>Nama Lengkap</label><input type="text" id="in-bride-name" class="form-control"></div><div class="form-group"><label>Nama Panggilan</label><input type="text" id="in-bride-nickname" class="form-control"></div><div class="form-group" style="grid-column: span 2;"><label>Nama Orang Tua</label><input type="text" id="in-bride-parents" class="form-control"></div></div></div>
                </div>

                <!-- TAB ACARA -->
                <div id="tab-acara" class="admin-tab" style="display: none;">

    <script>
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUam_J9n-f0-jaXxPW3BAXeXtklXetruYIpP8tcBNB_94jRFywHnLQtasC01JQbOOW/exec";

        let appData = {};
        let guestTarget = "Tamu Spesial";
        let sessionToken = sessionStorage.getItem('adminToken') || null;
        let countdownInterval;
        const root = document.getElementById('app-root');

        const vidingThemes = [
            { id: 'theme-envelope-velvet', name: 'Velvet Luxury', bg: 'linear-gradient(135deg, #3b0914, #27040c)' },
            { id: 'theme-palembang', name: 'Palembang Classic', bg: 'linear-gradient(135deg, #2a080c, #1f0407)' },
            { id: 'theme-jawa-royal', name: 'Royal Batik Jawa', bg: 'linear-gradient(135deg, #1a1612, #28221c)' },
            { id: 'theme-minang', name: 'Minang Crimson', bg: 'linear-gradient(135deg, #4a0000, #330000)' },
            { id: 'theme-chinese-radiance', name: 'Chinese Radiance', bg: 'linear-gradient(135deg, #7a0010, #52000b)' },
            { id: 'theme-floral', name: 'Floral Botanical', bg: 'linear-gradient(135deg, #556b2f, #a2b86c)' },
            { id: 'theme-boho', name: 'Boho Pampas', bg: 'linear-gradient(135deg, #c86d51, #ebd3c8)' },
            { id: 'theme-midnight', name: 'Midnight Glowing', bg: 'linear-gradient(135deg, #0c1017, #161f2e)' },
            { id: 'theme-minimalist', name: 'High Fashion Mono', bg: 'linear-gradient(135deg, #111111, #444444)' },
            { id: 'theme-emerald', name: 'Emerald Royalty', bg: 'linear-gradient(135deg, #127a53, #0a4f35)' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if(params.get('to')) {
                guestTarget = decodeURIComponent(params.get('to'));
                initApp(true);
            } else if(params.get('share') === 'true') {
                loadPublicShareView();
            } else {
                initApp(false);
            }
        });

        async function initApp(isGuestMode = false) {
            if(!isGuestMode) renderTemplate('tpl-portal');
            showLoading("Memuat sistem Viding...");
            const res = await fetchAPI('get_data');
            hideLoading();
            if(res.success) {
                appData = res.data;
                if(isGuestMode) loadGuestView();
            } else {
                showToast('error', 'Gagal memuat data dari server.');
            }
        }

        function loadGuestView() { renderTemplate('tpl-invitation'); setupGuestView(); }
        function loadLoginView() { if(sessionToken) loadAdminDashboard(); else renderTemplate('tpl-login'); }
        function loadPublicShareView() { renderTemplate('tpl-public-share'); }

        function renderTemplate(tplId) {
            root.innerHTML = '';
            root.appendChild(document.getElementById(tplId).content.cloneNode(true));
        }

        async function fetchAPI(action, payload = {}) {
            if (APP_SCRIPT_URL.includes("AKfycbzzzzzz")) {
                return new Promise(resolve => setTimeout(() => {
                    if (action === 'get_data') resolve({ success: true, data: { theme: 'theme-envelope-velvet', groomName: 'Romeo', groomNickname: 'Romeo', brideName: 'Juliet', brideNickname: 'Juliet', akadDate: '2026-12-24', akadTime: '08:00', resepsiDate: '2026-12-24', resepsiTime: '11:00', galleryUrls: [] } });
                    else if (action === 'login') resolve({ success: payload.username==='admin'&&payload.password==='admin123', data: { token: 'mock-123' }, message: 'Username/Pass Salah' });
                    else resolve({ success: true, message: 'Simulasi Sukses', data: { url: 'https://placehold.co/400x400/c5a059/ffffff?text=Viding+Media' } });
                }, 400));
            }
            try {
                if(sessionToken) payload.sessionToken = sessionToken;
                const res = await fetch(APP_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, payload }), headers: { "Content-Type": "text/plain;charset=utf-8" } });
                return await res.json();
            } catch(e) { return { success: false, message: "Kesalahan koneksi." }; }
        }

        async function handleLogin(e) {
            e.preventDefault();
            showLoading("Memverifikasi Login...");
            const res = await fetchAPI('login', { username: document.getElementById('login-user').value, password: document.getElementById('login-pass').value });
            hideLoading();
            if(res.success) { sessionToken = res.data.token; sessionStorage.setItem('adminToken', sessionToken); loadAdminDashboard(); }
            else showToast('error', res.message);
        }

        function loadAdminDashboard() {
            renderTemplate('tpl-admin-dashboard');
            const themeContainer = document.getElementById('viding-theme-container');
            vidingThemes.forEach(t => {
                const card = document.createElement('div');
                card.className = `viding-theme-card ${appData.theme === t.id ? 'active' : ''}`;
                card.onclick = () => selectVidingTheme(t.id);
                card.innerHTML = `<div class="viding-theme-preview" style="background: ${t.bg}">${t.name.split(' ')[0]}</div><p style="padding: 10px; font-weight: 700; text-align: center; color: #334155;">${t.name}</p>`;
                themeContainer.appendChild(card);
            });

            document.getElementById('in-groom-name').value = appData.groomName || '';
            document.getElementById('in-groom-nickname').value = appData.groomNickname || '';
            document.getElementById('in-groom-parents').value = appData.groomParents || '';
            document.getElementById('in-bride-name').value = appData.brideName || '';
            document.getElementById('in-bride-nickname').value = appData.brideNickname || '';
            document.getElementById('in-bride-parents').value = appData.brideParents || '';
            document.getElementById('in-akad-date').value = appData.akadDate || '';
            document.getElementById('in-akad-time').value = appData.akadTime || '';
            document.getElementById('in-resepsi-date').value = appData.resepsiDate || '';
            document.getElementById('in-resepsi-time').value = appData.resepsiTime || '';
            document.getElementById('in-location-name').value = appData.locationName || '';
            document.getElementById('in-location-link').value = appData.locationLink || '';
            document.getElementById('in-bank-name').value = appData.bankName || '';
            document.getElementById('in-bank-account').value = appData.bankAccount || '';
            document.getElementById('in-bank-owner').value = appData.bankOwner || '';

            const shareUrl = window.location.href.split('?')[0] + '?share=true';
            document.getElementById('pub-share-link').innerText = shareUrl;
        }

        function selectVidingTheme(id) {
            appData.theme = id;
            document.querySelectorAll('.viding-theme-card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        async function saveAllSettings() {
            showLoading("Menyimpan Pengaturan...");
            const payload = {
                theme: appData.theme,
                groomName: document.getElementById('in-groom-name').value,
                groomNickname: document.getElementById('in-groom-nickname').value,
                groomParents: document.getElementById('in-groom-parents').value,
                brideName: document.getElementById('in-bride-name').value,
                brideNickname: document.getElementById('in-bride-nickname').value,
                brideParents: document.getElementById('in-bride-parents').value,
                akadDate: document.getElementById('in-akad-date').value,
                akadTime: document.getElementById('in-akad-time').value,
                resepsiDate: document.getElementById('in-resepsi-date').value,
                resepsiTime: document.getElementById('in-resepsi-time').value,
                locationName: document.getElementById('in-location-name').value,
                locationLink: document.getElementById('in-location-link').value,
                bankName: document.getElementById('in-bank-name').value,
                bankAccount: document.getElementById('in-bank-account').value,
                bankOwner: document.getElementById('in-bank-owner').value,
                audioUrl: document.getElementById('in-audio-select').value
            };
            const res = await fetchAPI('save_settings', payload);
            hideLoading();
            if(res.success) showToast('success', 'Pengaturan berhasil disimpan!');
        }

        function previewSelectedMusic() {
            const player = document.getElementById('admin-audio-player');
            player.src = document.getElementById('in-audio-select').value;
            player.play();
        }

        function generatePublicLink() {
            const name = document.getElementById('pub-guest-name').value.trim();
            if(!name) return showToast('error', 'Masukkan nama tamu terlebih dahulu!');
            const url = window.location.href.split('?')[0] + '?to=' + encodeURIComponent(name);
            document.getElementById('pub-link-url').innerText = url;
            document.getElementById('pub-result-box').style.display = 'block';
        }

        function copyToClipboardText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Gagal menyalin teks:', err);
            }
            document.body.removeChild(textarea);
        }

        function copyPublicLink() {
            copyToClipboardText(document.getElementById('pub-link-url').innerText);
            showToast('success', 'Link disalin!');
        }
        function previewPublicLink() { window.open(document.getElementById('pub-link-url').innerText, '_blank'); }
        function copyPublicShareLink() { copyToClipboardText(document.getElementById('pub-share-link').innerText); showToast('success', 'Link generator disalin!'); }

        /* GUEST VIEW LOGIC */
        function setupGuestView() {
            const wrapper = document.getElementById('inv-wrapper');
            wrapper.className = `invitation-wrapper ${appData.theme || 'theme-envelope-velvet'}`;

            const gNick = appData.groomNickname || 'Pria';
            const bNick = appData.brideNickname || 'Wanita';
            const title = `${gNick} & ${bNick}`;

            document.getElementById('out-hero-title').innerText = title;
            document.getElementById('out-footer-title').innerText = title;
            document.getElementById('out-guest-name').innerText = guestTarget;

            document.getElementById('out-groom-nick').innerText = gNick;
            document.getElementById('out-groom-full').innerText = appData.groomName || 'Nama Lengkap Pria';
            document.getElementById('out-groom-parents').innerText = appData.groomParents || 'Orang Tua Pria';
            document.getElementById('out-groom-img').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(gNick)}&background=c5a059&color=fff&size=200`;

            document.getElementById('out-bride-nick').innerText = bNick;
            document.getElementById('out-bride-full').innerText = appData.brideName || 'Nama Lengkap Wanita';
            document.getElementById('out-bride-parents').innerText = appData.brideParents || 'Orang Tua Wanita';
            document.getElementById('out-bride-img').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(bNick)}&background=c5a059&color=fff&size=200`;

            document.getElementById('out-akad-date').innerText = formatDateIndo(appData.akadDate);
            document.getElementById('out-akad-time').innerText = (appData.akadTime || '08:00') + ' WIB';
            document.getElementById('out-resepsi-date').innerText = formatDateIndo(appData.resepsiDate);
            document.getElementById('out-resepsi-time').innerText = (appData.resepsiTime || '11:00') + ' WIB - Selesai';

            document.getElementById('out-location-name').innerText = appData.locationName || 'Gedung Pernikahan';
            document.getElementById('out-location-link').href = appData.locationLink || '#';

            document.getElementById('out-qris-img').src = appData.qrisUrl || 'https://placehold.co/200x200/c5a059/ffffff?text=QRIS';
            document.getElementById('out-bank-name').innerText = appData.bankName || 'BCA';
            document.getElementById('out-bank-acc').innerText = appData.bankAccount || '1234567890';
            document.getElementById('out-bank-owner').innerText = appData.bankOwner || 'Atas Nama';

            // Gallery
            const gGrid = document.getElementById('out-gallery-grid');
            gGrid.innerHTML = '';
            if(appData.galleryUrls && appData.galleryUrls.length > 0) {
                appData.galleryUrls.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.onclick = () => openLightbox(url);
                    gGrid.appendChild(img);
                });
            } else {
                gGrid.innerHTML = '<p style="grid-column: 1/-1; color: #888;">Belum ada foto galeri.</p>';
            }

            // Audio
            if(appData.audioUrl) document.getElementById('inv-bgm').src = appData.audioUrl;
            
            // Countdown
            startCountdown(appData.akadDate || '2026-12-24');
        }

        function openEnvelope() {
            document.getElementById('cover-envelope').classList.add('open');
            document.getElementById('floating-nav').classList.add('active');
            document.getElementById('audio-toggle').classList.add('visible');
            const bgm = document.getElementById('inv-bgm');
            if(bgm.src) bgm.play().catch(() => {});
        }

        let isPlaying = true;
        function toggleAudio() {
            const bgm = document.getElementById('inv-bgm');
            if(isPlaying) { bgm.pause(); isPlaying = false; }
            else { bgm.play(); isPlaying = true; }
        }

        function startCountdown(targetDateStr) {
            clearInterval(countdownInterval);
            const target = new Date(targetDateStr + "T00:00:00").getTime();
            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const diff = target - now;
                if(diff < 0) return clearInterval(countdownInterval);
                document.getElementById('cd-days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById('cd-hours').innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                document.getElementById('cd-minutes').innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                document.getElementById('cd-seconds').innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
            }, 1000);
        }

        function openLightbox(url) { document.getElementById('lightbox-img').src = url; document.getElementById('lightbox-modal').style.display = 'flex'; }
        function closeLightbox() { document.getElementById('lightbox-modal').style.display = 'none'; }
        function copyBankAcc() { copyToClipboardText(document.getElementById('out-bank-acc').innerText); showToast('success', 'Nomor rekening berhasil disalin!'); }

        function formatDateIndo(dStr) {
            if(!dStr) return '-';
            try {
                const d = new Date(dStr);
                return d.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            } catch(e) { return dStr; }
        }

        function switchTab(id, el) {
            document.querySelectorAll('.admin-tab').forEach(t => t.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.querySelectorAll('.sidebar-menu li').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
        }

        function showLoading(msg) { document.getElementById('load-msg').innerText = msg; document.getElementById('loading-overlay').classList.add('active'); }
        function hideLoading() { document.getElementById('loading-overlay').classList.remove('active'); }
        function showToast(type, msg) {
            const c = document.getElementById('toast-container'); const t = document.createElement('div');
            t.className = `toast ${type} show`; t.innerHTML = `<i class="fas fa-info-circle"></i> <span>${msg}</span>`;
            c.appendChild(t); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
        }
    </script>
</body>
</html>
