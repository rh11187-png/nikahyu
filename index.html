<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Undangan Pernikahan Terpadu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           GLOBAL VARIABLES & RESET
           ========================================= */
        :root {
            var(--primary): #d4af37; var(--primary-dark): #b5952f;
            var(--bg-color): #fbf8f1; var(--text-dark): #2c3e50;
            var(--text-light): #7f8c8d; var(--white): #ffffff;
            var(--border-color): #ddd; var(--admin-bg): #f4f6f9;
            var(--admin-sidebar): #1e293b; var(--admin-sidebar-text): #cbd5e1;
        }

        /* THEME CLASSES */
        .theme-gold { --primary: #d4af37; --primary-dark: #b5952f; --bg-color: #fbf8f1; --text-dark: #2c3e50; --white: #ffffff; }
        .theme-rustic { --primary: #6b8e23; --primary-dark: #556b2f; --bg-color: #f4f5f0; --text-dark: #3e4a3d; --white: #ffffff; }
        .theme-midnight { --primary: #f1c40f; --primary-dark: #f39c12; --bg-color: #0f172a; --text-dark: #f8fafc; --text-light: #cbd5e1; --white: #1e293b; --border-color: #334155; }
        .theme-rose { --primary: #b76e79; --primary-dark: #a05a66; --bg-color: #fdf6f5; --text-dark: #4a3b3c; --white: #ffffff; }
        .theme-vintage { --primary: #8b5a2b; --primary-dark: #6e4822; --bg-color: #f4ecd8; --text-dark: #3b2f2f; --white: #fdfbf7; }
        .theme-sapphire { --primary: #0f52ba; --primary-dark: #0a3d8c; --bg-color: #f0f4f8; --text-dark: #102a43; --white: #ffffff; }
        .theme-bohemian { --primary: #cd5c5c; --primary-dark: #b22222; --bg-color: #fdf5e6; --text-dark: #5c4033; --white: #ffffff; }
        .theme-minimalist { --primary: #555555; --primary-dark: #333333; --bg-color: #ffffff; --text-dark: #111111; --white: #f9f9f9; }
        .theme-velvet { --primary: #800020; --primary-dark: #600018; --bg-color: #fffaf0; --text-dark: #3b1c20; --white: #ffffff; }
        .theme-emerald { --primary: #50c878; --primary-dark: #3cb371; --bg-color: #f5fffa; --text-dark: #2f4f4f; --white: #ffffff; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lato', sans-serif; overflow-x: hidden; background: #fff; }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        .cursive { font-family: 'Great Vibes', cursive; color: var(--primary); }

        .modal-overlay { z-index: 1000; }
        #toast-container { z-index: 2000; }
        #loading-overlay { z-index: 9999; }

        /* UI COMPONENTS */
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: all 0.3s; }
        #loading-overlay.active { visibility: visible; opacity: 1; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #toast-container { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events:none; }
        .toast { background: #ffffff; color: #333; padding: 15px 25px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 15px; transform: translateX(120%); transition: transform 0.3s; border-left: 4px solid var(--primary); }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: #2ecc71; } .toast.success i { color: #2ecc71; }
        .toast.error { border-left-color: #e74c3c; } .toast.error i { color: #e74c3c; }

        .btn { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: 'Lato'; display: inline-block; text-align:center;}
        .btn-primary { background: var(--primary); color: #fff; } .btn-primary:hover { background: var(--primary-dark); }
        .btn-dark { background: var(--text-dark); color: #fff; } .btn-dark:hover { opacity: 0.9; }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--text-dark); }
        .form-control { width: 100%; padding: 10px 15px; border: 1px solid var(--border-color); border-radius: 8px; font-family: 'Lato'; background: var(--white); color: var(--text-dark); }
        .form-control:focus { outline: none; border-color: var(--primary); }

        /* PORTAL */
        .portal-bg { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1920&q=80') center/cover; }
        .portal-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); padding: 3.5rem 3rem; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; max-width: 500px; width: 90%; border: 1px solid rgba(255,255,255,0.5); }
        .portal-title { font-family: 'Great Vibes', cursive; font-size: 4rem; background: linear-gradient(45deg, #d4af37, #b5952f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .portal-btn-group { display: flex; flex-direction: column; gap: 15px; margin-top: 2.5rem; }
        .portal-btn { display: flex; align-items: center; justify-content: center; gap: 15px; padding: 15px; border-radius: 10px; font-size: 1.1rem; text-decoration: none; cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent; font-weight: 600; }
        .portal-guest { background: #ffffff; color: #d4af37; border-color: #d4af37; } .portal-guest:hover { background: #d4af37; color: #fff; transform: translateY(-3px); }
        .portal-admin { background: #2c3e50; color: #fff; } .portal-admin:hover { background: #1a252f; transform: translateY(-3px); }

        /* ADMIN */
        .admin-layout { display: flex; height: 100vh; background: var(--admin-bg); overflow: hidden; }
        .admin-sidebar { width: 250px; background: var(--admin-sidebar); color: var(--admin-sidebar-text); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background: rgba(0,0,0,0.2); text-align: center; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
        .sidebar-menu li { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .sidebar-menu li:hover, .sidebar-menu li.active { background: #d4af37; color: #fff; }
        .admin-content { flex: 1; overflow-y: auto; padding: 30px; }
        .admin-card { background: #fff; border-radius: 15px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .admin-card-title { font-size: 1.2rem; border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 20px; color: #333; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .theme-option { border: 2px solid #eee; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .theme-option:hover, .theme-option.active { border-color: #d4af37; transform: translateY(-3px); }
        .theme-option.active { background: #fbf8f1; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2); }
        .theme-color-preview { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 10px; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* GUEST VIEW */
        .invitation-wrapper { background-color: var(--bg-color); color: var(--text-dark); overflow-y: hidden; height: 100vh; position: relative; transition: background-color 0.5s, color 0.5s; }
        .invitation-wrapper.open { overflow-y: auto; }
        .cover-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1519741497674-611481863552?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #ffffff; z-index: 50; transition: transform 1s ease-in-out, opacity 1s ease-in-out; }
        .guest-name-box { margin: 2rem 0; padding: 1.5rem; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px); border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); }
        .inv-section { padding: 4rem 1.5rem; text-align: center; }
        .bg-white-dynamic { background: var(--white); transition: background 0.5s; }
        .couple-wrapper { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; max-width: 900px; margin: 0 auto; }
        .person { flex: 1; min-width: 250px; }
        .person img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 5px solid var(--white); box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
        .event-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; max-width: 900px; margin: 0 auto; }
        .e-card { background: var(--white); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 2.5rem; flex: 1; min-width: 280px; border-top: 5px solid var(--primary); transition: 0.5s; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .gallery-grid img { width: 100%; height: 250px; object-fit: cover; cursor: pointer; }
        .theme-gold .gallery-grid img { border-radius: 10px; transition: 0.4s; } .theme-gold .gallery-grid img:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(212,175,55,0.3); }
        .theme-rustic .gallery-grid img { border-radius: 30px 10px 30px 10px; transition: 0.4s; } .theme-rustic .gallery-grid img:hover { transform: rotate(-2deg) scale(1.03); border-radius: 10px 30px 10px 30px; box-shadow: 0 10px 20px rgba(107,142,35,0.3); }
        .theme-midnight .gallery-grid img { border-radius: 8px; border: 2px solid transparent; transition: 0.4s; } .theme-midnight .gallery-grid img:hover { border-color: var(--primary); box-shadow: 0 0 20px var(--primary); transform: translateY(-5px); }
        .theme-rose .gallery-grid img { border-radius: 100px 100px 10px 10px; transition: 0.4s; } .theme-rose .gallery-grid img:hover { transform: translateY(-10px); box-shadow: 0 15px 25px rgba(183,110,121,0.4); }
        .theme-vintage .gallery-grid img { padding: 10px 10px 40px 10px; background: #fff; border: 1px solid #ccc; filter: sepia(0.5); transition: 0.4s; } .theme-vintage .gallery-grid img:hover { transform: rotate(3deg) scale(1.05); filter: sepia(0); }
        .theme-sapphire .gallery-grid img { border: 4px solid var(--primary); transition: 0.3s; } .theme-sapphire .gallery-grid img:hover { border-width: 8px; filter: contrast(1.2); }
        .theme-bohemian .gallery-grid { grid-auto-rows: 200px; } .theme-bohemian .gallery-grid img { height: 100%; border-radius: 15px; filter: brightness(0.9) sepia(0.3); transition: 0.5s; } .theme-bohemian .gallery-grid img:hover { filter: brightness(1.1) sepia(0); transform: scale(1.02); }
        .theme-minimalist .gallery-grid img { filter: grayscale(100%); transition: 0.6s; } .theme-minimalist .gallery-grid img:hover { filter: grayscale(0%); transform: scale(1.03); }
        .theme-velvet .gallery-grid img { border: 4px double var(--primary); padding: 5px; background: var(--bg-color); transition: 0.4s; } .theme-velvet .gallery-grid img:hover { background: var(--primary); transform: scale(1.05); }
        .theme-emerald .gallery-grid img { border-radius: 50% 0 50% 0; transition: 0.5s; } .theme-emerald .gallery-grid img:hover { border-radius: 0 50% 0 50%; transform: scale(1.05); box-shadow: 0 10px 20px rgba(80,200,120,0.4); }

        .audio-btn { position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; background: var(--primary); color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 100; opacity:0; pointer-events:none; transition: 0.5s; }
        .audio-btn.visible { opacity:1; pointer-events:auto; }
        .back-portal-btn { position: fixed; top: 20px; left: 20px; z-index: 999; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; backdrop-filter: blur(5px); }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .admin-layout { flex-direction: column; }
            .admin-sidebar { width: 100%; flex-direction: row; overflow-x: auto; height: 60px; }
            .sidebar-header { display: none; }
            .sidebar-menu { display: flex; flex-direction: row; }
            .sidebar-menu li { padding: 10px 15px; white-space: nowrap; border-bottom: none; border-right: 1px solid rgba(255,255,255,0.05); }
        }
    </style>
</head>
<body>

    <div id="app-root"></div>
    <div id="toast-container"></div>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <h3 class="serif" style="color: var(--text-dark);" id="load-msg">Memproses...</h3>
    </div>

    <!-- TEMPLATE: PORTAL -->
    <template id="tpl-portal">
        <div class="portal-bg">
            <div class="portal-card">
                <h1 class="portal-title">Sistem Undangan</h1>
                <p style="color: #555; margin-bottom: 20px; font-size: 1.1rem;">Pilih peran Anda untuk masuk.</p>
                <div class="portal-btn-group">
                    <button class="portal-btn portal-guest" onclick="loadGuestView()"><i class="fas fa-envelope-open-text"></i> Lihat Undangan (Tamu)</button>
                    <button class="portal-btn portal-admin" onclick="loadLoginView()"><i class="fas fa-user-shield"></i> Masuk Panel Admin</button>
                </div>
            </div>
        </div>
    </template>

    <!-- TEMPLATE: ADMIN LOGIN -->
    <template id="tpl-login">
        <div style="height: 100vh; display: flex; justify-content: center; align-items: center; background: #1e293b;">
            <button class="back-portal-btn" onclick="initApp()"><i class="fas fa-arrow-left"></i> Kembali</button>
            <div style="background: #fff; padding: 2.5rem; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <i class="fas fa-lock" style="font-size: 3rem; color: #d4af37; margin-bottom: 1rem;"></i>
                    <h2 class="serif" style="color: #333;">Admin Panel</h2>
                </div>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group"><label>Username</label><input type="text" id="login-user" class="form-control" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="login-pass" class="form-control" required></div>
                    <button type="submit" class="btn" style="width: 100%; background:#d4af37; color:#fff;">Masuk Dashboard</button>
                </form>
            </div>
        </div>
    </template>

    <!-- TEMPLATE: ADMIN DASHBOARD -->
    <template id="tpl-admin-dashboard">
        <div class="admin-layout">
            <button class="back-portal-btn" style="bottom: 20px; top: auto;" onclick="initApp()"><i class="fas fa-sign-out-alt"></i> Keluar</button>
            <div class="admin-sidebar">
                <div class="sidebar-header"><h2 class="cursive" style="color:#d4af37; font-size: 2rem;">Panel Admin</h2></div>
                <ul class="sidebar-menu">
                    <li class="active" onclick="switchTab('tab-tema', this)"><i class="fas fa-paint-brush"></i> Tema & Desain</li>
                    <li onclick="switchTab('tab-mempelai', this)"><i class="fas fa-user-friends"></i> Data Mempelai</li>
                    <li onclick="switchTab('tab-acara', this)"><i class="fas fa-calendar-alt"></i> Data Acara</li>
                    <li onclick="switchTab('tab-media', this)"><i class="fas fa-images"></i> Media & Musik</li>
                    <li onclick="switchTab('tab-keuangan', this)"><i class="fas fa-wallet"></i> QRIS & Rekening</li>
                    <li onclick="switchTab('tab-sebar', this)"><i class="fas fa-share-alt"></i> Sebar Undangan</li>
                </ul>
            </div>
            <div class="admin-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 class="serif" style="color: #333;">Pengaturan Undangan</h2>
                    <button class="btn" style="background:#2c3e50; color:#fff;" onclick="saveAllSettings()"><i class="fas fa-save"></i> Simpan ke Database</button>
                </div>
                <!-- TEMA -->
                <div id="tab-tema" class="admin-tab">
                    <div class="admin-card">
                        <h3 class="admin-card-title">Pilih Tema Layout</h3>
                        <div class="theme-grid" id="admin-theme-grid">
                            <!-- Populated in JS -->
                        </div>
                    </div>
                </div>
                <!-- MEMPELAI -->
                <div id="tab-mempelai" class="admin-tab" style="display: none;">
                    <div class="admin-card"><h3 class="admin-card-title">Mempelai Pria</h3><div class="grid-2"><div class="form-group"><label>Nama</label><input type="text" id="in-groom-name" class="form-control"></div><div class="form-group"><label>Orang Tua</label><input type="text" id="in-groom-parents" class="form-control"></div></div></div>
                    <div class="admin-card"><h3 class="admin-card-title">Mempelai Wanita</h3><div class="grid-2"><div class="form-group"><label>Nama</label><input type="text" id="in-bride-name" class="form-control"></div><div class="form-group"><label>Orang Tua</label><input type="text" id="in-bride-parents" class="form-control"></div></div></div>
                </div>
                <!-- ACARA -->
                <div id="tab-acara" class="admin-tab" style="display: none;">
                    <div class="admin-card"><h3 class="admin-card-title">Akad Nikah</h3><div class="grid-2"><div class="form-group"><label>Tanggal</label><input type="text" id="in-akad-date" class="form-control"></div><div class="form-group"><label>Waktu</label><input type="text" id="in-akad-time" class="form-control"></div></div></div>
                    <div class="admin-card"><h3 class="admin-card-title">Resepsi</h3><div class="grid-2"><div class="form-group"><label>Tanggal</label><input type="text" id="in-resepsi-date" class="form-control"></div><div class="form-group"><label>Waktu</label><input type="text" id="in-resepsi-time" class="form-control"></div></div></div>
                    <div class="admin-card"><h3 class="admin-card-title">Lokasi</h3><div class="form-group"><label>Nama Gedung</label><input type="text" id="in-location-name" class="form-control"></div><div class="form-group"><label>Link Maps</label><input type="text" id="in-location-link" class="form-control"></div></div>
                </div>
                <!-- MEDIA -->
                <div id="tab-media" class="admin-tab" style="display: none;">
                    <div class="admin-card">
                        <h3 class="admin-card-title">Galeri Foto (Pilih 1 untuk tambah)</h3>
                        <div class="form-group"><label>Upload Foto (Otomatis Simpan ke Drive)</label><input type="file" id="in-gallery-upload" class="form-control" accept="image/*"></div>
                        <button class="btn btn-primary" onclick="uploadSingleMedia('gallery')">Upload Foto ke Galeri</button>
                    </div>
                    <div class="admin-card">
                        <h3 class="admin-card-title">Musik Latar (BGM)</h3>
                        <div class="form-group"><label>Ganti .mp3</label><input type="file" id="in-audio-upload" class="form-control" accept="audio/*"></div>
                        <button class="btn btn-primary" onclick="uploadSingleMedia('audio')">Upload Musik</button>
                    </div>
                </div>
                <!-- KEUANGAN -->
                <div id="tab-keuangan" class="admin-tab" style="display: none;">
                    <div class="admin-card">
                        <h3 class="admin-card-title">QRIS Baru</h3>
                        <div class="form-group"><label>Gambar QRIS</label><input type="file" id="in-qris-upload" class="form-control" accept="image/*"></div>
                        <button class="btn btn-primary" onclick="uploadSingleMedia('qris')">Upload QRIS</button>
                    </div>
                    <div class="admin-card"><h3 class="admin-card-title">Rekening</h3><div class="grid-2"><div class="form-group"><label>Bank</label><input type="text" id="in-bank-name" class="form-control"></div><div class="form-group"><label>No Rek</label><input type="text" id="in-bank-account" class="form-control"></div><div class="form-group"><label>Atas Nama</label><input type="text" id="in-bank-owner" class="form-control"></div></div></div>
                </div>
                <!-- SEBAR -->
                <div id="tab-sebar" class="admin-tab" style="display: none;">
                    <div class="admin-card"><h3 class="admin-card-title">Link Generator</h3><div style="background: #e8f4f8; padding: 20px; border-radius: 10px; border: 1px dashed #3498db;"><div class="form-group"><label>Nama Tamu</label><div style="display: flex; gap: 10px;"><input type="text" id="generator-name" class="form-control"><button class="btn" style="background:#3498db; color:#fff;" onclick="generateLink()">Buat Link</button></div></div><div id="generated-result" style="display: none;"><code id="result-link" style="display:block; background:#fff; padding:10px; margin-top:10px; word-break:break-all;"></code><button class="btn" style="background:#2c3e50; color:#fff; margin-top:10px; font-size:0.8rem;" onclick="copyLink()">Salin Link</button></div></div></div>
                </div>
            </div>
        </div>
    </template>

    <!-- TEMPLATE: GUEST INVITATION -->
    <template id="tpl-invitation">
        <button class="back-portal-btn" onclick="stopAudio(); initApp()"><i class="fas fa-home"></i> Beranda</button>
        <audio id="inv-bgm" loop></audio>
        <div class="audio-btn" id="audio-toggle" onclick="toggleAudio()"><i class="fas fa-compact-disc spin" id="audio-icon"></i></div>

        <div class="invitation-wrapper theme-gold" id="inv-wrapper">
            <div class="cover-screen" id="cover-screen">
                <h1 class="cursive" style="font-size: 4rem; margin-bottom: 0.5rem;" id="out-cover-title">Title</h1>
                <p style="letter-spacing: 2px; margin-bottom: 2rem;" id="out-cover-date">DATE</p>
                <div class="guest-name-box">
                    <p>Kepada Yth. Bapak/Ibu/Saudara/i:</p>
                    <h2 class="serif" id="out-guest-name">Tamu Undangan</h2>
                    <p style="font-size: 0.9rem; font-style: italic;">Mohon maaf apabila ada kesalahan penulisan nama</p>
                </div>
                <button class="btn btn-primary" style="font-size: 1.1rem; padding: 15px 30px; border-radius: 30px;" onclick="openInvitation()"><i class="fas fa-envelope-open-text"></i> Buka Undangan</button>
            </div>

            <section class="inv-section bg-white-dynamic" style="padding-top: 5rem;">
                <h2 class="serif" style="font-size: 2.5rem; margin-bottom: 1rem; color: var(--text-dark);">Sang Mempelai</h2>
                <div class="couple-wrapper">
                    <div class="person"><img src="https://ui-avatars.com/api/?name=Pria&background=random" id="out-groom-img" alt="Groom"><h3 class="cursive" style="font-size: 2.5rem;" id="out-groom-name">Pria</h3><p style="color: var(--text-light);" id="out-groom-parents">Orang Tua</p></div>
                    <div class="cursive" style="font-size: 4rem; line-height: 1;">&</div>
                    <div class="person"><img src="https://ui-avatars.com/api/?name=Wanita&background=random" id="out-bride-img" alt="Bride"><h3 class="cursive" style="font-size: 2.5rem;" id="out-bride-name">Wanita</h3><p style="color: var(--text-light);" id="out-bride-parents">Orang Tua</p></div>
                </div>
            </section>

            <section class="inv-section">
                <h2 class="serif" style="font-size: 2.5rem; margin-bottom: 3rem; color: var(--text-dark);">Rangkaian Acara</h2>
                <div class="event-cards">
                    <div class="e-card"><i class="fas fa-ring" style="font-size: 2rem; color: var(--primary); margin-bottom: 1rem;"></i><h3 class="serif" style="font-size: 1.5rem;">Akad Nikah</h3><p><strong id="out-akad-date">-</strong></p><p id="out-akad-time">-</p></div>
                    <div class="e-card"><i class="fas fa-glass-cheers" style="font-size: 2rem; color: var(--primary); margin-bottom: 1rem;"></i><h3 class="serif" style="font-size: 1.5rem;">Resepsi</h3><p><strong id="out-resepsi-date">-</strong></p><p id="out-resepsi-time">-</p></div>
                </div>
                <div class="bg-white-dynamic" style="padding: 2rem; border-radius: 15px; max-width: 600px; margin: 2rem auto 0; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                    <h3 class="serif" style="margin-bottom: 1rem; font-size: 1.5rem;">Lokasi Acara</h3>
                    <p style="margin-bottom: 1.5rem;" id="out-location-name">-</p>
                    <a href="#" id="out-location-btn" onclick="showToast('info', 'Membuka Google Maps')" class="btn btn-primary" target="_blank" style="text-decoration:none;"><i class="fas fa-map-marker-alt"></i> Buka Google Maps</a>
                </div>
            </section>

            <section class="inv-section bg-white-dynamic">
                <h2 class="serif" style="font-size: 2.5rem; margin-bottom: 3rem; color: var(--text-dark);">Galeri Momen</h2>
                <div class="gallery-grid" id="out-gallery-container"></div>
            </section>

            <section class="inv-section">
                <h2 class="serif" style="font-size: 2.5rem; margin-bottom: 1rem; color: var(--text-dark);">Amplop Digital</h2>
                <div class="bg-white-dynamic" style="padding: 2.5rem; border-radius: 15px; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                    <div style="background:#fff; padding:15px; border-radius:10px; border:2px dashed #ccc; display:inline-block; margin-bottom:1.5rem;">
                        <img id="out-qris-img" src="" alt="QRIS" style="max-width: 200px;">
                        <p style="margin-top: 10px; font-weight:bold; color:#333;">SCAN QRIS</p>
                    </div>
                    <div style="margin-bottom: 2rem; padding:15px; background:var(--bg-color); border-radius:10px;">
                        <p style="margin-bottom:5px;"><strong id="out-bank-name">-</strong> - <span id="out-bank-account">-</span></p>
                        <p>a.n <span id="out-bank-owner">-</span></p>
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 2rem;">
                    <h3 class="serif" style="margin-bottom: 1rem; text-align:left;">Konfirmasi Transfer</h3>
                    <form onsubmit="guestSubmitUpload(event)" style="text-align: left;">
                        <div class="form-group"><label>Nama Pengirim</label><input type="text" id="tf-sender" class="form-control" required></div>
                        <div class="form-group"><label>Upload Bukti (JPG/PNG)</label><input type="file" id="tf-file" class="form-control" accept="image/*" required></div>
                        <button type="submit" class="btn btn-dark" style="width: 100%;">Kirim Bukti Transfer</button>
                    </form>
                </div>
            </section>

            <footer style="background-color: var(--primary); color: #fff; padding: 4rem 1rem; text-align: center;">
                <h2 class="cursive" style="font-size: 3rem; margin-bottom: 1rem; color: #fff;" id="out-footer-title">Title</h2>
                <p>Terima kasih atas doa restu Bapak/Ibu/Saudara/i</p>
            </footer>
        </div>
    </template>

    <script>
        /**
         ============================================================
         WAJIB DIUBAH!
         Ganti URL di bawah dengan URL Web App Anda setelah deploy.
         ============================================================
        */
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUam_J9n-f0-jaXxPW3BAXeXtklXetruYIpP8tcBNB_94jRFywHnLQtasC01JQbOOW/exec";

        let appData = {};
        let guestNameTarget = "Tamu Spesial";
        let sessionToken = sessionStorage.getItem('adminToken') || null;
        const root = document.getElementById('app-root');

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('to')) guestNameTarget = decodeURIComponent(urlParams.get('to'));
            initApp();
        });

        async function initApp() {
            renderTemplate('tpl-portal');
            showLoading("Memuat Data Utama...");
            const res = await fetchAPI('get_data');
            hideLoading();
            if(res.success) {
                appData = res.data;
            } else {
                showToast('error', 'Gagal memuat data dari server.');
            }
        }

        function loadGuestView() { renderTemplate('tpl-invitation'); setupInvitation(); }
        function loadLoginView() { if(sessionToken) { loadAdminDashboard(); } else { renderTemplate('tpl-login'); } }

        function renderTemplate(tplId) {
            root.innerHTML = '';
            root.appendChild(document.getElementById(tplId).content.cloneNode(true));
        }

        /* --- API HELPER --- */
        async function fetchAPI(action, payload = {}) {
            // Mencegah error "Failed to fetch" jika URL Apps Script belum diubah
            if (APP_SCRIPT_URL.includes("AKfycbzzzzzz")) {
                console.warn("Mode Demo Aktif: Menggunakan Mock API karena URL Apps Script masih bawaan.");
                return new Promise(resolve => {
                    setTimeout(() => {
                        if (action === 'get_data') {
                            resolve({ success: true, data: { theme: 'theme-gold', groomName: 'Romeo', brideName: 'Juliet', galleryUrls: [] } });
                        } else if (action === 'login') {
                            if (payload.username === 'admin' && payload.password === 'admin123') resolve({ success: true, data: { token: 'mock-token-123' } });
                            else resolve({ success: false, message: 'Username atau Password Salah' });
                        } else if (action === 'save_settings' || action === 'upload_media' || action === 'upload_transfer') {
                            resolve({ success: true, message: 'Berhasil (Mode Simulasi)', data: { url: 'https://placehold.co/400x400/d4af37/ffffff?text=Media+Simulasi' } });
                        } else {
                            resolve({ success: false, message: 'Aksi tidak dikenal.' });
                        }
                    }, 500); // Simulasi delay loading jaringan
                });
            }

            try {
                if(sessionToken) payload.sessionToken = sessionToken;
                const req = await fetch(APP_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: action, payload: payload }),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                return await req.json();
            } catch (e) {
                console.error(e);
                return { success: false, message: "Terjadi kesalahan jaringan atau CORS." };
            }
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        /* --- ADMIN AUTH --- */
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            showLoading("Memverifikasi...");
            const res = await fetchAPI('login', { username: u, password: p });
            hideLoading();
            
            if(res.success) {
                sessionToken = res.data.token;
                sessionStorage.setItem('adminToken', sessionToken);
                showToast('success', 'Login Berhasil!');
                loadAdminDashboard();
            } else {
                showToast('error', res.message);
            }
        }

        /* --- ADMIN DASHBOARD --- */
        const themes = [
            { id: 'theme-gold', name: 'Gold Elegance', color: '#d4af37' },
            { id: 'theme-rustic', name: 'Rustic Green', color: '#6b8e23' },
            { id: 'theme-midnight', name: 'Midnight Romance', color: '#0f172a' },
            { id: 'theme-rose', name: 'Rose Gold', color: '#b76e79' }
        ];

        function switchTab(tabId, el) {
            document.querySelectorAll('.admin-tab').forEach(t => t.style.display = 'none');
            document.getElementById(tabId).style.display = 'block';
            document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));
            el.classList.add('active');
        }

        function selectTheme(themeId) {
            appData.theme = themeId;
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.theme === themeId);
            });
        }

        function loadAdminDashboard() {
            renderTemplate('tpl-admin-dashboard');
            
            const themeGrid = document.getElementById('admin-theme-grid');
            themes.forEach(t => {
                const div = document.createElement('div');
                div.className = `theme-option ${appData.theme === t.id ? 'active' : ''}`;
                div.dataset.theme = t.id;
                div.onclick = () => selectTheme(t.id);
                div.innerHTML = `<div class="theme-color-preview" style="background: ${t.color};"></div><strong>${t.name}</strong>`;
                themeGrid.appendChild(div);
            });

            document.getElementById('in-groom-name').value = appData.groomName || '';
            document.getElementById('in-groom-parents').value = appData.groomParents || '';
            document.getElementById('in-bride-name').value = appData.brideName || '';
            document.getElementById('in-bride-parents').value = appData.brideParents || '';
            document.getElementById('in-akad-date').value = appData.akadDate || '';
            document.getElementById('in-akad-time').value = appData.akadTime || '';
            document.getElementById('in-resepsi-date').value = appData.resepsiDate || '';
            document.getElementById('in-resepsi-time').value = appData.resepsiTime || '';
            document.getElementById('in-location-name').value = appData.locationName || '';
            document.getElementById('in-location-link').value = appData.locationLink || '';
            document.getElementById('in-bank-name').value = appData.bankName || '';
            document.getElementById('in-bank-account').value = appData.bankAccount || '';
            document.getElementById('in-bank-owner').value = appData.bankOwner || '';
        }

        async function saveAllSettings() {
            showLoading("Menyimpan ke Database...");
            const payload = {
                theme: appData.theme,
                groomName: document.getElementById('in-groom-name').value,
                groomParents: document.getElementById('in-groom-parents').value,
                brideName: document.getElementById('in-bride-name').value,
                brideParents: document.getElementById('in-bride-parents').value,
                akadDate: document.getElementById('in-akad-date').value,
                akadTime: document.getElementById('in-akad-time').value,
                resepsiDate: document.getElementById('in-resepsi-date').value,
                resepsiTime: document.getElementById('in-resepsi-time').value,
                locationName: document.getElementById('in-location-name').value,
                locationLink: document.getElementById('in-location-link').value,
                bankName: document.getElementById('in-bank-name').value,
                bankAccount: document.getElementById('in-bank-account').value,
                bankOwner: document.getElementById('in-bank-owner').value
            };
            
            const res = await fetchAPI('save_settings', payload);
            hideLoading();
            if(res.success) {
                appData = {...appData, ...payload};
                showToast('success', 'Pengaturan berhasil disimpan!');
            } else {
                showToast('error', res.message);
            }
        }

        async function uploadSingleMedia(type) {
            let fileInput;
            if(type === 'gallery') fileInput = document.getElementById('in-gallery-upload');
            if(type === 'audio') fileInput = document.getElementById('in-audio-upload');
            if(type === 'qris') fileInput = document.getElementById('in-qris-upload');
            
            if(!fileInput.files.length) return showToast('error', 'Pilih file terlebih dahulu');
            
            const file = fileInput.files[0];
            showLoading("Mengunggah ke Drive...");
            
            try {
                const base64Data = await fileToBase64(file);
                const res = await fetchAPI('upload_media', { 
                    fileData: base64Data, 
                    fileName: file.name, 
                    mimeType: file.type,
                    uploadType: type
                });
                
                hideLoading();
                if(res.success) {
                    showToast('success', 'File berhasil diunggah!');
                    if(type === 'gallery') {
                        if(!appData.galleryUrls) appData.galleryUrls = [];
                        appData.galleryUrls.push(res.data.url);
                    } else if(type === 'audio') {
                        appData.audioUrl = res.data.url;
                    } else if(type === 'qris') {
                        appData.qrisUrl = res.data.url;
                    }
                    fileInput.value = "";
                } else {
                    showToast('error', res.message);
                }
            } catch(e) {
                hideLoading();
                showToast('error', 'Gagal memproses file.');
            }
        }

        function generateLink() {
            const name = document.getElementById('generator-name').value.trim();
            if(!name) return showToast('error', 'Masukkan nama tamu terlebih dahulu');
            const baseUrl = window.location.href.split('?')[0];
            const finalLink = `${baseUrl}?to=${encodeURIComponent(name)}`;
            document.getElementById('result-link').innerText = finalLink;
            document.getElementById('generated-result').style.display = 'block';
        }

        function copyLink() {
            const linkText = document.getElementById('result-link').innerText;
            navigator.clipboard.writeText(linkText).then(() => showToast('success', 'Link disalin!')).catch(() => {
                const ta = document.createElement("textarea"); ta.value = linkText; document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); showToast('success', 'Link disalin!'); } catch (e) { showToast('error', 'Gagal menyalin.'); }
                document.body.removeChild(ta);
            });
        }

        /* --- GUEST INVITATION --- */
        let isAudioPlaying = false;
        function setupInvitation() {
            const wrapper = document.getElementById('inv-wrapper');
            wrapper.className = `invitation-wrapper ${appData.theme || 'theme-gold'}`;

            const shortGroom = (appData.groomName || 'Pria').split(' ')[0];
            const shortBride = (appData.brideName || 'Wanita').split(' ')[0];
            const coupleTitle = `${shortGroom} & ${shortBride}`;
            
            document.getElementById('out-cover-title').innerText = coupleTitle;
            document.getElementById('out-footer-title').innerText = coupleTitle;
            document.getElementById('out-cover-date').innerText = (appData.akadDate || '').toUpperCase();
            document.getElementById('out-guest-name').innerText = guestNameTarget;
            
            document.getElementById('out-groom-name').innerText = shortGroom;
            document.getElementById('out-groom-parents').innerText = appData.groomParents;
            document.getElementById('out-bride-name').innerText = shortBride;
            document.getElementById('out-bride-parents').innerText = appData.brideParents;
            
            document.getElementById('out-akad-date').innerText = appData.akadDate;
            document.getElementById('out-akad-time').innerText = appData.akadTime;
            document.getElementById('out-resepsi-date').innerText = appData.resepsiDate;
            document.getElementById('out-resepsi-time').innerText = appData.resepsiTime;
            
            document.getElementById('out-location-name').innerText = appData.locationName;
            document.getElementById('out-location-btn').href = appData.locationLink || '#';
            
            document.getElementById('out-bank-name').innerText = appData.bankName;
            document.getElementById('out-bank-account').innerText = appData.bankAccount;
            document.getElementById('out-bank-owner').innerText = appData.bankOwner;
            
            if(appData.qrisUrl) document.getElementById('out-qris-img').src = appData.qrisUrl;
            if(appData.audioUrl) document.getElementById('inv-bgm').src = appData.audioUrl;

            const gc = document.getElementById('out-gallery-container');
            gc.innerHTML = '';
            if(appData.galleryUrls) {
                appData.galleryUrls.forEach(url => {
                    const img = document.createElement('img'); img.src = url; gc.appendChild(img);
                });
            }
        }

        function openInvitation() {
            const cover = document.getElementById('cover-screen');
            const wrapper = document.getElementById('inv-wrapper');
            cover.style.transform = 'translateY(-100vh)'; cover.style.opacity = '0';
            wrapper.classList.add('open');
            document.getElementById('audio-toggle').classList.add('visible');
            setTimeout(() => { cover.style.display = 'none'; }, 1000);
            
            const bgm = document.getElementById('inv-bgm');
            if(bgm.src) {
                bgm.play().then(() => {
                    isAudioPlaying = true; document.getElementById('audio-icon').className = 'fas fa-compact-disc spin';
                }).catch(e => console.log("Autoplay prevented by browser"));
            }
        }

        function toggleAudio() {
            const bgm = document.getElementById('inv-bgm');
            const icon = document.getElementById('audio-icon');
            if (isAudioPlaying) { bgm.pause(); isAudioPlaying = false; icon.className = 'fas fa-play'; } 
            else { bgm.play(); isAudioPlaying = true; icon.className = 'fas fa-compact-disc spin'; }
        }

        function stopAudio() {
            const bgm = document.getElementById('inv-bgm');
            if(bgm) { bgm.pause(); bgm.currentTime = 0; }
            isAudioPlaying = false;
        }

        async function guestSubmitUpload(e) {
            e.preventDefault();
            const sender = document.getElementById('tf-sender').value;
            const fileInput = document.getElementById('tf-file');
            
            if(!fileInput.files.length) return;
            showLoading("Mengirim Bukti Transfer...");
            
            try {
                const base64Data = await fileToBase64(fileInput.files[0]);
                const res = await fetchAPI('upload_transfer', { 
                    senderName: sender,
                    fileData: base64Data, 
                    fileName: fileInput.files[0].name,
                    mimeType: fileInput.files[0].type
                });
                
                hideLoading();
                if(res.success) {
                    showToast('success', 'Terima kasih! Bukti transfer berhasil dikirim.');
                    e.target.reset();
                } else {
                    showToast('error', res.message);
                }
            } catch(error) {
                hideLoading();
                showToast('error', 'Gagal mengirim bukti transfer.');
            }
        }

        function showLoading(msg = "Memproses...") { 
            document.getElementById('load-msg').innerText = msg;
            document.getElementById('loading-overlay').classList.add('active'); 
        }
        function hideLoading() { document.getElementById('loading-overlay').classList.remove('active'); }
        function showToast(type, msg) {
            const c = document.getElementById('toast-container'); const t = document.createElement('div');
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            t.className = `toast ${type}`; t.innerHTML = `<i class="fas ${icon}"></i> <span>${msg}</span>`;
            c.appendChild(t); setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
        }
    </script>
</body>
</html>
